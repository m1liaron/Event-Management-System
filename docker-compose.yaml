  #version: '3.8'

  services: 
    backend:
      build: ./backend
      container_name: backend-event-management-system
      ports: 
        - "4000:4000"
      depends_on:
        - db
      volumes: 
        - ./backend:/app
        - /app/node_modules

    frontend: 
      build: ./frontend
      container_name: frontend-event-management-system
      volumes:
        - ./frontend:/app
    
    db:
      image: postgres:15
      container_name: postgres-event-management-system
      ports:
        - "5434:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data: