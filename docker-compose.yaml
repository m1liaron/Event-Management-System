  #version: '3.8'
  services: 
    backend:
      build: ./backend
      container_name: backend-event-management-system
      ports: 
        - "4000:4000"
      env_file:
        - .env
      depends_on:
        - db

    frontend: 
      build: ./frontend
      container_name: frontend-event-management-system
      ports:
        - "5173:80"
      volumes:
        - ./frontend:/app
      env_file:
        - .env
    
    db:
      image: postgres:15
      container_name: postgres-event-management-system
      environment:
        POSTGRES_USER: ${DB_USER}          
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_NAME}
      ports:
        - "5434:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data: